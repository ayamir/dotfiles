onboarding = false

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
kitty_graphics = true

[theme]
name = "rose-pine-dawn"

auto_switch = false
[ui.toast]
delivery = "system"

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/bytedance/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

status_indicators = "symbols"
[ui.sound]
enabled = false

[update]
channel = "stable"

[keys]
goto = "prefix+p"
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"
open_worktree = "prefix+e"
remove_worktree = "prefix+shift+e"
edit_scrollback = ""

# agent
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# workspace
switch_workspace = "prefix+ctrl+1..9"
previous_workspace = "prefix+ctrl+k"
next_workspace = "prefix+ctrl+j"
close_workspace = "prefix+shift+d"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "$HOME/.config/herdr/herdr-file-jump.sh"
description = "jump to file:line under cursor in nvim pane"

[remote]
# resume_agents_on_restore = true

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"       # 排序：active <-> recent

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"        # 设置弹窗

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#b9cdf2"
# <<< herdr-radar theme block

