# rose-pine-dawn (light)
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#575279,bg=#f2e9e1"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#907aa9"
set -g status-style "none,bg=#faf4ed"
set -g message-style "fg=#575279,bg=#f2e9e1"
set -g pane-border-style "fg=#f2e9e1"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none,fg=#907aa9,bg=#faf4ed"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#575279,bg=#faf4ed"
set -g status-left "#[fg=#fffaf3,bg=#907aa9] #S #[fg=#907aa9,bg=#f2e9e1,nobold,nounderscore,noitalics]#[fg=#575279,bg=#f2e9e1] %R #[fg=#f2e9e1,bg=#faf4ed,nobold,nounderscore,noitalics]#[fg=#faf4ed,bg=#faf4ed,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#faf4ed,bg=#faf4ed,nobold,nounderscore,noitalics]#[fg=#575279,bg=#faf4ed]  #{network_speed} #[fg=#f2e9e1,bg=#faf4ed,nobold,nounderscore,noitalics]#[fg=#575279,bg=#f2e9e1] %a #[fg=#907aa9,bg=#f2e9e1,nobold,nounderscore,noitalics]#[fg=#fffaf3,bg=#907aa9] #H #{prefix_highlight} "
setw -g window-status-format "#[fg=#faf4ed,bg=#faf4ed,nobold,nounderscore,noitalics]#[fg=#575279] #I  #W #[fg=#faf4ed,bg=#faf4ed,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#faf4ed,bg=#f2e9e1,nobold,nounderscore,noitalics]#[fg=#575279,bg=#f2e9e1] #I  #W  #F #[fg=#f2e9e1,bg=#faf4ed,nobold,nounderscore,noitalics]"
